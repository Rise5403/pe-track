<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Principal Engineer Track — Who clears it first?</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0a0a0a; color: #fff; font-family: Inter, system-ui, sans-serif; min-height: 100vh; }

  /* Config screen */
  .config-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .config-box { width: 100%; max-width: 440px; }
  .config-card { background: #111; border: 1px solid #222; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
  .config-label { font-size: 12px; color: #777; margin-bottom: 6px; display: block; }
  .config-input { width: 100%; background: #0a0a0a; border: 1px solid #333; border-radius: 8px; color: #fff; font-size: 14px; padding: 10px 12px; outline: none; font-family: monospace; }
  .config-input:focus { border-color: #84CC16; }
  .btn-connect { background: #84CC16; border: none; border-radius: 8px; color: #000; font-size: 14px; font-weight: 800; padding: 12px 0; cursor: pointer; width: 100%; transition: opacity 0.2s; }
  .btn-connect:disabled { opacity: 0.6; cursor: default; }
  .error-box { font-size: 12px; color: #ef4444; padding: 8px 12px; background: #1a0808; border-radius: 6px; border: 1px solid #5a1a1a; }
  .steps-box { margin-top: 16px; background: #111; border: 1px solid #1a1a1a; border-radius: 10px; padding: 14px 16px; }
  .steps-title { font-size: 11px; font-weight: 700; color: #555; margin-bottom: 8px; letter-spacing: 0.5px; }
  .step-row { display: flex; gap: 10px; margin-bottom: 6px; }
  .step-num { font-size: 11px; color: #84CC16; font-weight: 700; min-width: 16px; }
  .step-txt { font-size: 11px; color: #555; line-height: 1.5; }

  /* Main app */
  .app { padding: 24px 16px; max-width: 900px; margin: 0 auto; }
  .header { text-align: center; margin-bottom: 20px; }
  .header-eye { font-size: 11px; font-weight: 700; color: #BEF264; letter-spacing: 2px; margin-bottom: 6px; }
  .header-title { font-size: 28px; font-weight: 900; letter-spacing: -0.8px; margin-bottom: 4px; }
  .header-sub { font-size: 13px; color: #555; }
  .status-pill { margin-left: 10px; font-size: 12px; }

  /* Phase track */
  .phase-track { display: flex; gap: 6px; margin-bottom: 16px; }
  .phase-card { flex: 1; background: #111; border: 1px solid #222; border-radius: 8px; padding: 10px 12px; }
  .phase-label { font-size: 10px; font-weight: 700; letter-spacing: 1px; margin-bottom: 4px; }
  .phase-cert { font-size: 13px; font-weight: 800; color: #fff; }
  .phase-levels { font-size: 11px; color: #555; margin-top: 2px; }
  .phase-dots { display: flex; gap: 6px; margin-top: 8px; }
  .phase-dot { width: 8px; height: 8px; border-radius: 50%; transition: background 0.4s; }

  /* VS bar */
  .vs-bar { background: #111; border: 1px solid #222; border-radius: 8px; padding: 12px 20px; display: flex; align-items: center; justify-content: center; gap: 24px; margin-bottom: 16px; }
  .vs-level { font-size: 22px; font-weight: 900; }
  .vs-name { font-size: 11px; color: #555; text-align: center; margin-top: 2px; }
  .vs-text { font-size: 18px; color: #84CC16; font-weight: 900; }

  /* Player grid */
  .player-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media(max-width: 600px) { .player-grid { grid-template-columns: 1fr; } .phase-track { flex-direction: column; } }

  /* Player card */
  .player-card { background: #0a0a0a; border: 1px solid #222; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; transition: border-color 0.4s, box-shadow 0.4s; }
  .player-card.leading { }
  .card-header { background: #111; padding: 18px 18px 14px; }
  .card-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 14px; }
  .player-name { font-size: 20px; font-weight: 800; letter-spacing: -0.3px; cursor: text; min-height: 28px; }
  .player-name.empty { color: #444; }
  .name-input { background: transparent; border: none; border-bottom: 2px solid #84CC16; color: #fff; font-size: 20px; font-weight: 800; outline: none; width: 100%; font-family: inherit; }
  .player-phase { font-size: 12px; font-weight: 600; margin-top: 4px; }
  .leading-badge { margin-left: 8px; color: #F59E0B; font-size: 11px; }
  .level-display { text-align: right; }
  .level-num { font-size: 52px; font-weight: 900; line-height: 1; letter-spacing: -2px; }
  .level-lbl { font-size: 11px; color: #555; font-weight: 600; margin-top: 2px; }

  /* XP bars */
  .bar-wrap { margin-bottom: 8px; }
  .bar-meta { display: flex; justify-content: space-between; margin-bottom: 4px; font-size: 11px; color: #555; }
  .bar-track { background: #222; border-radius: 4px; height: 8px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 4px; transition: width 0.6s cubic-bezier(.4,0,.2,1); }

  /* Tabs */
  .tabs { display: flex; border-bottom: 1px solid #222; }
  .tab-btn { flex: 1; padding: 10px 0; background: transparent; border: none; border-bottom: 2px solid transparent; color: #555; font-size: 12px; font-weight: 700; cursor: pointer; font-family: inherit; transition: color 0.2s, border-color 0.2s; }
  .tab-btn.active { border-bottom-color: currentColor; }

  /* Card body */
  .card-body { padding: 12px 14px; flex: 1; overflow-y: auto; max-height: 400px; }

  /* Topic rows */
  .topic-row { margin-bottom: 6px; }
  .topic-head { display: flex; align-items: center; gap: 8px; padding: 7px 10px; background: #111; border-radius: 6px; cursor: pointer; border: 1px solid #222; transition: opacity 0.2s; }
  .topic-head.gated { opacity: 0.35; cursor: default; background: #0a0a0a; border-color: #1a1a1a; }
  .topic-name { flex: 1; font-size: 12px; color: #e2e2e2; line-height: 1.3; }
  .topic-name.gated { color: #444; }
  .topic-xp { font-size: 12px; font-weight: 700; min-width: 40px; text-align: right; }
  .topic-arrow { font-size: 10px; color: #444; }
  .topic-components { background: #0a0a0a; border-radius: 0 0 6px 6px; padding: 8px 10px; border: 1px solid #222; border-top: none; }
  .comp-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; cursor: pointer; }
  .comp-row input[type=checkbox] { width: 14px; height: 14px; cursor: pointer; }
  .comp-name { font-size: 12px; color: #777; flex: 1; }
  .comp-xp { font-size: 12px; font-weight: 700; }

  /* Cert badges */
  .cert-list { display: flex; flex-direction: column; gap: 10px; }
  .cert-badge { border-radius: 8px; padding: 10px 14px; display: flex; align-items: center; gap: 10px; transition: all 0.3s; border: 1px solid #333; }
  .cert-icon { width: 36px; height: 36px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; overflow: hidden; }
  .cert-icon img { width: 100%; height: 100%; object-fit: contain; }
  .cert-info { flex: 1; }
  .cert-name { font-size: 13px; font-weight: 700; }
  .cert-status { font-size: 11px; color: #555; margin-top: 2px; }
  .cert-upload-btn { border: none; border-radius: 6px; font-size: 11px; font-weight: 700; padding: 5px 10px; cursor: pointer; }
  .cert-note { margin-top: 8px; padding: 10px 12px; background: #111; border-radius: 8px; font-size: 11px; color: #555; line-height: 1.6; }

  /* Footer */
  .footer { text-align: center; margin-top: 20px; font-size: 11px; color: #333; display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; }
  .btn-disconnect { background: transparent; border: 1px solid #222; border-radius: 4px; color: #333; font-size: 10px; padding: 2px 8px; cursor: pointer; font-family: inherit; }
  .btn-refresh { background: transparent; border: 1px solid #222; border-radius: 6px; color: #555; font-size: 11px; padding: 4px 10px; cursor: pointer; font-family: inherit; margin-top: 6px; }

  input[type=file] { display: none; }
</style>
</head>
<body>

<div id="root"></div>

<script>
// ── Constants ─────────────────────────────────────────────────────────────────

const PHASES = [
  { id:1, cert:"SC-300", label:"Identity",  levels:[1,15],  color:"#84CC16" },
  { id:2, cert:"MD-102", label:"Endpoint",  levels:[16,30], color:"#aaaaaa" },
  { id:3, cert:"SC-401", label:"Data",      levels:[31,45], color:"#BEF264" },
];

const TOPICS = [
  { id:"t1",  phase:1, name:"Authentication protocols from the wire up" },
  { id:"t2",  phase:1, name:"User identities and tenant management" },
  { id:"t3",  phase:1, name:"Authentication and access management" },
  { id:"t4",  phase:1, name:"Workload identities" },
  { id:"t5",  phase:1, name:"Identity governance" },
  { id:"t6a", phase:1, name:"Compliance: identity layer" },
  { id:"t7a", phase:1, name:"Architectural decision-making: identity" },
  { id:"t6",  phase:2, name:"Device infrastructure and enrollment" },
  { id:"t7",  phase:2, name:"Device management and maintenance" },
  { id:"t8",  phase:2, name:"Endpoint protection" },
  { id:"t9",  phase:2, name:"Application management" },
  { id:"t10", phase:2, name:"Endpoint automation, monitoring, reporting" },
  { id:"t6b", phase:2, name:"Compliance: endpoint layer" },
  { id:"t7b", phase:2, name:"Architectural decision-making: endpoint" },
  { id:"t11", phase:3, name:"Information protection" },
  { id:"t12", phase:3, name:"Data loss prevention and retention" },
  { id:"t13", phase:3, name:"Risk, alerts, and activities" },
  { id:"t14", phase:3, name:"Microsoft Sentinel" },
  { id:"t15", phase:3, name:"Compliance posture communication" },
  { id:"t6c", phase:3, name:"Compliance: data layer" },
  { id:"t7c", phase:3, name:"Architectural decision-making: data" },
];

const XP_COMPS = [
  { id:"quiz",        label:"Concept Quiz",  xp:60 },
  { id:"buildlab",    label:"Build Lab",     xp:50 },
  { id:"forensiclab", label:"Forensic Lab",  xp:50 },
  { id:"artifact",    label:"Artifact",      xp:40 },
];

const THRESHOLDS = (() => {
  const t = [0];
  for(let i=1;i<=3;i++)  t.push(t[t.length-1]+60);
  for(let i=4;i<=7;i++)  t.push(t[t.length-1]+100);
  for(let i=8;i<=11;i++) t.push(t[t.length-1]+130);
  for(let i=12;i<=15;i++)t.push(t[t.length-1]+160);
  for(let i=16;i<=18;i++)t.push(t[t.length-1]+60);
  for(let i=19;i<=22;i++)t.push(t[t.length-1]+100);
  for(let i=23;i<=26;i++)t.push(t[t.length-1]+130);
  for(let i=27;i<=30;i++)t.push(t[t.length-1]+160);
  for(let i=31;i<=33;i++)t.push(t[t.length-1]+60);
  for(let i=34;i<=37;i++)t.push(t[t.length-1]+100);
  for(let i=38;i<=41;i++)t.push(t[t.length-1]+130);
  for(let i=42;i<=45;i++)t.push(t[t.length-1]+160);
  return t;
})();

const GATES   = {15:"SC-300",30:"MD-102",45:"SC-401"};
const GATE_XP = {15:1190,30:1190,45:1190};

const DEFAULT_PLAYER = {name:"",xp:0,topics:{},certs:{},certImages:{}};
const DEFAULT_STATE  = {player1:{...DEFAULT_PLAYER},player2:{...DEFAULT_PLAYER}};

// ── Helpers ───────────────────────────────────────────────────────────────────

function getLevel(xp, certs) {
  let level = 1;
  for(let i=1;i<=45;i++){
    if(xp < THRESHOLDS[i]) break;
    if(GATES[i] && !certs[GATES[i]]) break;
    level = i;
  }
  return level;
}

function getPhase(level) {
  return level<=15 ? 1 : level<=30 ? 2 : 3;
}

function getPhaseXP(xp, phase) {
  const starts = [0,0,THRESHOLDS[15],THRESHOLDS[30]];
  return Math.max(0, xp - starts[phase]);
}

function phaseColor(phase) { return PHASES[phase-1].color; }

function deepClone(obj) { return JSON.parse(JSON.stringify(obj)); }

// ── JSONbin API ───────────────────────────────────────────────────────────────

async function jbLoad(binId, apiKey) {
  const res = await fetch(`https://api.jsonbin.io/v3/b/${binId}/latest`, {
    headers: { "X-Master-Key": apiKey.trim(), "X-Bin-Meta": "false" }
  });
  if(!res.ok) {
    const txt = await res.text().catch(()=>"");
    throw new Error(`${res.status} — ${txt.slice(0,120)}`);
  }
  const data = await res.json();
  return data.record ?? data;
}

async function jbSave(binId, apiKey, state) {
  const payload = {
    player1: {...state.player1, certImages:{}},
    player2: {...state.player2, certImages:{}}
  };
  const res = await fetch(`https://api.jsonbin.io/v3/b/${binId}`, {
    method: "PUT",
    headers: {"Content-Type":"application/json","X-Master-Key":apiKey.trim(),"X-Bin-Versioning":"false"},
    body: JSON.stringify(payload)
  });
  if(!res.ok) {
    const txt = await res.text().catch(()=>"");
    throw new Error(`${res.status} — ${txt.slice(0,120)}`);
  }
}

// ── App State ─────────────────────────────────────────────────────────────────

let binId  = localStorage.getItem("jb_bin")  || "";
let apiKey = localStorage.getItem("jb_key")  || "";
let state  = deepClone(DEFAULT_STATE);
let localImages = {player1:{}, player2:{}};
let openTopics = {};   // topicId -> bool
let activeTabs = {player1:"topics", player2:"topics"};
let nameEditing = {player1:false, player2:false};
let statusText = "";
let statusColor = "#555";
let saveTimer = null;
let pollTimer = null;

// ── Render engine (vanilla DOM) ───────────────────────────────────────────────

function render() {
  const root = document.getElementById("root");
  const configured = binId && apiKey;
  if(!configured) { root.innerHTML = renderConfig(); bindConfig(); return; }
  root.innerHTML = renderApp();
  bindApp();
}

// ── Config Screen ─────────────────────────────────────────────────────────────

function renderConfig() {
  return `
  <div class="config-wrap">
    <div class="config-box">
      <div class="header" style="margin-bottom:28px">
        <div class="header-eye">PRINCIPAL ENGINEER TRACK</div>
        <div class="header-title">Connect your scoreboard</div>
        <div class="header-sub" style="margin-top:6px;line-height:1.6">
          Enter your JSONbin credentials. Both players use the same Bin ID and API Key.
        </div>
      </div>
      <div class="config-card">
        <div>
          <label class="config-label">Bin ID</label>
          <input id="inp-bin" class="config-input" placeholder="e.g. 6a9ddb0a..." value="${binId}" />
        </div>
        <div>
          <label class="config-label">Master API Key</label>
          <input id="inp-key" class="config-input" type="password" placeholder="$2a$10$..." value="${apiKey}" />
        </div>
        <div id="cfg-error" class="error-box" style="display:none"></div>
        <button id="btn-connect" class="btn-connect">Connect</button>
      </div>
      <div class="steps-box">
        <div class="steps-title">SETUP — JSONBIN.IO</div>
        ${["Go to jsonbin.io and create a free account",
           'Click "New Bin", paste the default JSON content, click Save',
           "Copy the Bin ID from the URL (24-char string)",
           "Go to API Keys → create Master Key → copy it",
           "Paste both above and click Connect",
           "Share your Bin ID + API Key with your competitor"].map((s,i)=>`
          <div class="step-row">
            <span class="step-num">${i+1}.</span>
            <span class="step-txt">${s}</span>
          </div>`).join("")}
      </div>
    </div>
  </div>`;
}

function bindConfig() {
  document.getElementById("btn-connect").addEventListener("click", async () => {
    const bId = document.getElementById("inp-bin").value.trim();
    const aKey = document.getElementById("inp-key").value.trim();
    const errEl = document.getElementById("cfg-error");
    const btn = document.getElementById("btn-connect");
    if(!bId || !aKey) { errEl.textContent="Both fields are required."; errEl.style.display="block"; return; }
    btn.disabled = true; btn.textContent = "Connecting…"; errEl.style.display="none";
    try {
      const data = await jbLoad(bId, aKey);
      binId = bId; apiKey = aKey;
      localStorage.setItem("jb_bin", bId);
      localStorage.setItem("jb_key", aKey);
      // Merge loaded data
      state.player1 = {...DEFAULT_PLAYER, ...(data.player1||{}), certImages:{}};
      state.player2 = {...DEFAULT_PLAYER, ...(data.player2||{}), certImages:{}};
      startPolling();
      render();
    } catch(e) {
      errEl.textContent = "Connection failed: " + e.message;
      errEl.style.display = "block";
      btn.disabled = false; btn.textContent = "Connect";
    }
  });
}

// ── App Screen ────────────────────────────────────────────────────────────────

function renderApp() {
  const p1 = state.player1, p2 = state.player2;
  const l1 = getLevel(p1.xp, p1.certs), l2 = getLevel(p2.xp, p2.certs);
  const ph1 = getPhase(l1), ph2 = getPhase(l2);

  return `
  <div class="app">
    <div class="header">
      <div class="header-eye">PRINCIPAL ENGINEER TRACK</div>
      <div class="header-title">Who clears it first?</div>
      <div class="header-sub">
        SC-300 → MD-102 → SC-401 · 45 Levels · 3,400 XP
        <span id="status-pill" class="status-pill" style="color:${statusColor}">${statusText}</span>
      </div>
      <button class="btn-refresh" id="btn-refresh">↻ Refresh</button>
    </div>

    <div class="phase-track">
      ${PHASES.map(p => {
        const p1in = l1>=p.levels[0], p2in = l2>=p.levels[0];
        const p1done = !!p1.certs[p.cert], p2done = !!p2.certs[p.cert];
        return `
        <div class="phase-card">
          <div class="phase-label" style="color:${p.color}">PHASE ${p.id}</div>
          <div class="phase-cert">${p.cert}</div>
          <div class="phase-levels">Lvl ${p.levels[0]}–${p.levels[1]}</div>
          <div class="phase-dots">
            <div class="phase-dot" style="background:${p1done?"#F59E0B":p1in?p.color:"#222"}" title="${p1.name||"Player 1"}"></div>
            <div class="phase-dot" style="background:${p2done?"#F59E0B":p2in?p.color:"#222"}" title="${p2.name||"Player 2"}"></div>
          </div>
        </div>`}).join("")}
    </div>

    ${(p1.name||p2.name) ? `
    <div class="vs-bar">
      <div>
        <div class="vs-level" style="color:${phaseColor(ph1)}">${l1}</div>
        <div class="vs-name">${p1.name||"Player 1"}</div>
      </div>
      <div class="vs-text">VS</div>
      <div>
        <div class="vs-level" style="color:${phaseColor(ph2)}">${l2}</div>
        <div class="vs-name">${p2.name||"Player 2"}</div>
      </div>
    </div>` : ""}

    <div class="player-grid">
      ${renderPlayerCard("player1", p1, p2, l1, l2)}
      ${renderPlayerCard("player2", p2, p1, l2, l1)}
    </div>

    <div class="footer">
      <span>Syncs every 30 seconds · Any device · Any browser</span>
      <button class="btn-disconnect" id="btn-disconnect">Disconnect</button>
    </div>
  </div>`;
}

function renderPlayerCard(pid, p, opp, level, oppLevel) {
  const phase = getPhase(level);
  const color = phaseColor(phase);
  const nextGate = [15,30,45].find(g=>g>level)||45;
  const nextCert = GATES[nextGate];
  const phXP = getPhaseXP(p.xp, phase);
  const phXPNeeded = GATE_XP[nextGate];
  const certDone = !!p.certs[nextCert];
  const curLvlXP = THRESHOLDS[level]||0;
  const nxtLvlXP = THRESHOLDS[Math.min(level+1,45)]||THRESHOLDS[45];
  const lvlPct = nxtLvlXP>curLvlXP ? ((p.xp-curLvlXP)/(nxtLvlXP-curLvlXP))*100 : 100;
  const isLeading = opp.name && (level>oppLevel||(level===oppLevel&&p.xp>(opp.xp||0)));
  const tab = activeTabs[pid];
  const editing = nameEditing[pid];

  return `
  <div class="player-card" id="card-${pid}" style="border-color:${isLeading?color:"#222"};box-shadow:${isLeading?`0 0 24px ${color}33`:"none"}">
    <div class="card-header">
      <div class="card-top">
        <div>
          ${editing
            ? `<input class="name-input" id="name-input-${pid}" value="${p.name}" placeholder="Enter name" style="border-bottom-color:${color}" />`
            : `<div class="player-name ${p.name?"":"empty"}" id="name-display-${pid}" data-pid="${pid}">${p.name||"Click to name"}</div>`
          }
          <div class="player-phase" style="color:${color}">
            ${PHASES[phase-1].label} · ${PHASES[phase-1].cert}
            ${isLeading?`<span class="leading-badge">▲ LEADING</span>`:""}
          </div>
        </div>
        <div class="level-display">
          <div class="level-num" style="color:${color}">${level}</div>
          <div class="level-lbl">LEVEL</div>
        </div>
      </div>
      <div class="bar-wrap">
        <div class="bar-meta"><span>Level ${level} → ${Math.min(level+1,45)}</span><span>${p.xp} XP</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.min(100,lvlPct)}%;background:${color}"></div></div>
      </div>
      <div class="bar-wrap" style="margin-top:8px">
        <div class="bar-meta">
          <span>Gate: Lvl ${nextGate} (${nextCert})</span>
          <span style="color:${certDone?"#F59E0B":"#555"}">${certDone?"CERT UPLOADED ✓":`${phXP} / ${phXPNeeded} XP`}</span>
        </div>
        <div class="bar-track"><div class="bar-fill" style="width:${certDone?100:Math.min(100,(phXP/phXPNeeded)*100)}%;background:${certDone?"#F59E0B":color}"></div></div>
      </div>
    </div>

    <div class="tabs">
      <button class="tab-btn ${tab==="topics"?"active":""}" data-pid="${pid}" data-tab="topics" style="color:${tab==="topics"?color:"#555"}">Topics</button>
      <button class="tab-btn ${tab==="certs"?"active":""}" data-pid="${pid}" data-tab="certs" style="color:${tab==="certs"?color:"#555"}">Certifications</button>
    </div>

    <div class="card-body">
      ${tab==="topics" ? renderTopics(pid, p, color) : renderCerts(pid, p)}
    </div>
  </div>`;
}

function renderTopics(pid, p, color) {
  return TOPICS.map(t => {
    const phColor = phaseColor(t.phase);
    const gated = (t.phase===2 && !p.certs["SC-300"]) || (t.phase===3 && !p.certs["MD-102"]);
    const earned = XP_COMPS.reduce((s,c)=>s+(p.topics[t.id]?.[c.id]?c.xp:0),0);
    const isOpen = openTopics[pid+"_"+t.id];
    return `
    <div class="topic-row">
      <div class="topic-head ${gated?"gated":""}" ${gated?"":`data-pid="${pid}" data-tid="${t.id}"`} id="th-${pid}-${t.id}">
        <div class="topic-name ${gated?"gated":""}">${t.name}</div>
        <div class="topic-xp" style="color:${earned>0?phColor:"#444"}">${earned}/200</div>
        ${gated?"":`<div class="topic-arrow">${isOpen?"▲":"▼"}</div>`}
      </div>
      ${isOpen && !gated ? `
      <div class="topic-components">
        ${XP_COMPS.map(c=>`
        <label class="comp-row">
          <input type="checkbox" data-pid="${pid}" data-tid="${t.id}" data-cid="${c.id}" ${p.topics[t.id]?.[c.id]?"checked":""} style="accent-color:${phColor}" />
          <span class="comp-name">${c.label}</span>
          <span class="comp-xp" style="color:${p.topics[t.id]?.[c.id]?phColor:"#444"}">+${c.xp} XP</span>
        </label>`).join("")}
      </div>` : ""}
    </div>`;
  }).join("");
}

function renderCerts(pid, p) {
  return `<div class="cert-list">
    ${PHASES.map(ph => {
      const locked = ph.id>1 && !p.certs[PHASES[ph.id-2].cert];
      const img = localImages[pid][ph.cert] || p.certImages?.[ph.cert];
      const color = ph.color;
      return `
      <div class="cert-badge" style="border-color:${locked?"#333":color};background:${locked?"#111":color+"18"}">
        <div class="cert-icon" style="background:${locked?"#222":color+"30"}">
          ${img?`<img src="${img}" alt="${ph.cert}" />`:(locked?"🔒":"🏅")}
        </div>
        <div class="cert-info">
          <div class="cert-name" style="color:${locked?"#555":color}">${ph.cert}</div>
          <div class="cert-status">${locked?"Gate locked":img?"Verified ✓":"Upload cert image"}</div>
        </div>
        ${!locked?`
        <label style="cursor:pointer">
          <span class="cert-upload-btn" style="background:${img?color+"20":color};color:${img?color:"#000"}">${img?"Replace":"Upload"}</span>
          <input type="file" accept="image/*" data-pid="${pid}" data-cert="${ph.cert}" />
        </label>`:""}
      </div>`;
    }).join("")}
    <div class="cert-note">Upload a screenshot of your passing score report to unlock the next gate.</div>
  </div>`;
}

// ── Bind events ───────────────────────────────────────────────────────────────

function bindApp() {
  // Refresh
  document.getElementById("btn-refresh")?.addEventListener("click", ()=>loadRemote(false));

  // Disconnect
  document.getElementById("btn-disconnect")?.addEventListener("click", ()=>{
    clearInterval(pollTimer);
    localStorage.removeItem("jb_bin"); localStorage.removeItem("jb_key");
    binId=""; apiKey=""; render();
  });

  // Name display click → edit
  document.querySelectorAll("[id^=name-display-]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const pid = el.dataset.pid;
      nameEditing[pid]=true; render(); 
      const inp = document.getElementById(`name-input-${pid}`);
      if(inp){ inp.focus(); inp.select(); }
    });
  });

  // Name input blur/enter
  document.querySelectorAll("[id^=name-input-]").forEach(inp=>{
    const pid = inp.id.replace("name-input-","");
    function commit(){ nameEditing[pid]=false; state[pid].name=inp.value; scheduleSave(); render(); }
    inp.addEventListener("blur", commit);
    inp.addEventListener("keydown", e=>{ if(e.key==="Enter") commit(); });
  });

  // Tab buttons
  document.querySelectorAll(".tab-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      activeTabs[btn.dataset.pid]=btn.dataset.tab; render();
    });
  });

  // Topic row toggle
  document.querySelectorAll(".topic-head:not(.gated)").forEach(el=>{
    if(!el.dataset.pid) return;
    el.addEventListener("click", ()=>{
      const key = el.dataset.pid+"_"+el.dataset.tid;
      openTopics[key]=!openTopics[key]; render();
    });
  });

  // Checkboxes
  document.querySelectorAll("input[data-pid][data-tid][data-cid]").forEach(cb=>{
    cb.addEventListener("change", ()=>{
      const {pid,tid,cid} = cb.dataset;
      if(!state[pid].topics[tid]) state[pid].topics[tid]={};
      state[pid].topics[tid][cid]=cb.checked;
      // Recalc XP
      state[pid].xp = TOPICS.reduce((sum,t)=>
        sum+XP_COMPS.reduce((s,c)=>s+(state[pid].topics[t.id]?.[c.id]?c.xp:0),0),0);
      scheduleSave(); render();
    });
  });

  // Cert uploads
  document.querySelectorAll("input[type=file][data-pid][data-cert]").forEach(inp=>{
    inp.addEventListener("change", ()=>{
      const {pid,cert} = inp.dataset;
      const file = inp.files[0]; if(!file) return;
      const reader = new FileReader();
      reader.onload = ev=>{
        localImages[pid][cert]=ev.target.result;
        state[pid].certs[cert]=true;
        // Also save image to state for JSONbin (base64 may be large but we try)
        if(!state[pid].certImages) state[pid].certImages={};
        state[pid].certImages[cert]=ev.target.result;
        scheduleSave(); render();
      };
      reader.readAsDataURL(file);
    });
  });
}

// ── Save / Load / Poll ────────────────────────────────────────────────────────

function setStatus(text, color) {
  statusText=text; statusColor=color;
  const el=document.getElementById("status-pill");
  if(el){ el.textContent=text; el.style.color=color; }
}

function scheduleSave() {
  clearTimeout(saveTimer);
  setStatus("Saving…","#777");
  saveTimer = setTimeout(async ()=>{
    try {
      await jbSave(binId, apiKey, state);
      setStatus("Saved ✓","#84CC16");
      setTimeout(()=>setStatus("","#555"),2500);
    } catch(e) {
      setStatus("Save failed","#ef4444");
    }
  }, 800);
}

async function loadRemote(silent=false) {
  if(!silent) setStatus("Syncing…","#aaaaaa");
  try {
    const remote = await jbLoad(binId, apiKey);
    state.player1 = {...DEFAULT_PLAYER,...(remote.player1||{}), certImages:{...localImages.player1,...(remote.player1?.certImages||{})}};
    state.player2 = {...DEFAULT_PLAYER,...(remote.player2||{}), certImages:{...localImages.player2,...(remote.player2?.certImages||{})}};
    if(!silent) setStatus("","#555");
    render();
  } catch(e) {
    if(!silent) setStatus("Sync failed","#ef4444");
  }
}

function startPolling() {
  clearInterval(pollTimer);
  pollTimer = setInterval(()=>loadRemote(true), 30000);
}

// ── Boot ──────────────────────────────────────────────────────────────────────

async function boot() {
  if(binId && apiKey) {
    document.getElementById("root").innerHTML = `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center"><div style="color:#BEF264;font-size:14px;font-weight:600">Loading scoreboard…</div></div>`;
    try {
      const remote = await jbLoad(binId, apiKey);
      state.player1 = {...DEFAULT_PLAYER,...(remote.player1||{}),certImages:{}};
      state.player2 = {...DEFAULT_PLAYER,...(remote.player2||{}),certImages:{}};
      startPolling();
    } catch(e) {
      // Credentials stored but load failed — clear and show config
      localStorage.removeItem("jb_bin"); localStorage.removeItem("jb_key");
      binId=""; apiKey="";
    }
  }
  render();
}

boot();
</script>
